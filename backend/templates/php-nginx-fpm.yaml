id: php-nginx-fpm
name: PHP (Nginx + PHP-FPM)
version: "8.3"
description: PHP application served by Nginx with PHP-FPM. Any PHP version from 7.0 to 8.4, with mysqli, pdo_mysql, opcache and bcmath built in.
icon: https://serverkit.ai/imgs/template-icons/php-app.svg
website: https://www.php.net
documentation: https://www.php.net/docs.php
categories:
  - development
  - web
  - custom

variables:
  - name: HTTP_PORT
    description: HTTP port for the application
    type: port
    default: "8110"
    hidden: true
  - name: PHP_VERSION
    description: PHP version (7.0, 7.1, 7.2, 7.3, 7.4, 8.0, 8.1, 8.2, 8.3, 8.4)
    type: string
    default: "8.3"
  - name: PHP_EXTENSIONS
    description: Extensions to compile in (space-separated; ones that need no extra system libraries, e.g. exif calendar sockets pcntl)
    type: string
    default: "mysqli pdo_mysql opcache bcmath"
  - name: DOCUMENT_ROOT
    description: Web root inside the container (use /var/www/html/public for Laravel)
    type: string
    default: "/var/www/html"
  - name: UPLOAD_MAX
    description: Maximum upload size (PHP and Nginx)
    type: string
    default: "64M"

ports:
  - port: 8110
    protocol: tcp
    description: Web interface (Nginx)

volumes:
  - name: html
    path: /var/www/html
    description: Application files (put your PHP code here)

requirements:
  memory: 256MB
  storage: 1GB

files:
  - path: Dockerfile
    content: |
      FROM php:${PHP_VERSION}-fpm
      RUN docker-php-ext-install ${PHP_EXTENSIONS}
      RUN { \
            echo 'upload_max_filesize=${UPLOAD_MAX}'; \
            echo 'post_max_size=${UPLOAD_MAX}'; \
            echo 'memory_limit=256M'; \
            echo 'expose_php=Off'; \
          } > /usr/local/etc/php/conf.d/zz-serverkit.ini
      COPY index.php /var/www/html/index.php
  - path: index.php
    content: |
      <?php
      // Placeholder from the ServerKit "PHP (Nginx + PHP-FPM)" template. Replace with your app.
      echo '<!doctype html><title>It works</title><h1>It works</h1>';
      echo '<p>Nginx + PHP-FPM, PHP ' . htmlspecialchars(PHP_VERSION) . '</p>';
  - path: /etc/nginx/conf.d/default.conf
    content: |
      server {
          listen 80;
          server_name _;
          root ${DOCUMENT_ROOT};
          index index.php index.html;
          client_max_body_size ${UPLOAD_MAX};

          # The host's nginx proxies here and already resolved the visitor IP.
          set_real_ip_from 172.16.0.0/12;
          real_ip_header X-Forwarded-For;

          location ~ /\.(?!well-known) { deny all; }

          location / {
              try_files $uri $uri/ /index.php?$query_string;
          }

          location ~ \.php$ {
              try_files $uri =404;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
              fastcgi_read_timeout 300;
              fastcgi_pass php:9000;
          }
      }

compose:
  services:
    web:
      image: nginx:1.28-alpine
      container_name: ${APP_NAME}
      restart: unless-stopped
      # Loopback only: the host's nginx (domains + HTTPS) proxies to this port.
      ports:
        - "127.0.0.1:${HTTP_PORT}:80"
      volumes:
        - html:/var/www/html:ro
      depends_on:
        - php
    php:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: ${APP_NAME}-php
      restart: unless-stopped
      volumes:
        - html:/var/www/html

  volumes:
    html:

post_install: |
  Your PHP app (Nginx + PHP-FPM) is ready.

  To add your code:
    docker cp ./your-files/. ${APP_NAME}-php:/var/www/html/

  To access the PHP container:
    docker exec -it ${APP_NAME}-php bash

  PHP version, extensions and the web root are in Dockerfile and
  default.conf in the app folder; edit them and redeploy to change.
